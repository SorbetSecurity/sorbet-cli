<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sorbet · evidence explorer</title>
<!--
  Fully self-contained, offline SPA. No external origin is ever
  referenced — no CDN, no web font, no remote asset — so the strict CSP the server
  sends (`default-src 'self'`) is satisfied structurally and this works air-gapped.
  All application logic is in /assets/app.js (script-src 'self' forbids inline JS).
-->
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%237c6cf0'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> sorbet</div>
    <nav id="nav" class="nav"></nav>
    <div class="topbar-right">
      <select id="run-picker" class="run-picker" aria-label="run"></select>
      <button id="theme-toggle" class="ghost-btn" title="toggle theme (t)">◑</button>
    </div>
  </header>
  <main id="view" class="view"><div class="loading">loading…</div></main>
  <footer class="statusbar"><span id="status">ready</span>
    <span class="grow"></span>
    <span class="offline-badge" title="no network, no telemetry — everything is local">● offline</span>
  </footer>
</div>
<script src="/assets/app.js"></script>
</body>
</html>
