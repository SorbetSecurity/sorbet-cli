[project]
name = "sorbet"
version = "0.1.0"
description = "Sorbet CLI (sorb) — evidence-backed dependency analysis and SBOM generation engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sorbet contributors" }]
keywords = ["sbom", "cyclonedx", "spdx", "dependencies", "supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "packageurl-python>=0.15",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "pathspec>=0.12",
    "httpx>=0.27",
    "zstandard>=0.22",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# The embedded web UI (`sorb ui` / `sorb serve`). Kept out of the base install
# so the CLI stays lean and the <300ms startup budget holds — FastAPI/uvicorn
# import only inside the ui/serve code paths.
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# Offline disk-image backend (qcow2/VMDK/ext4/XFS/Btrfs/NTFS/LVM).
disk = [
    "dissect.target>=3.0",
]
# Untrusted WASM cataloger plugins. Runtime only; signature
# verification and findings re-validation are in the base install.
wasm = [
    "wasmtime>=20.0",
]
# Out-of-process gRPC plugins & cloud snapshot providers.
grpc = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",  # enforces the "a parser may raise, never hang" contract
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "setuptools>=69",  # PEP 517 backend for the dynamic-manifest fixture
    "fastapi>=0.110",  # UI server tests
    "uvicorn>=0.29",
]

[project.scripts]
sorb = "sorb.cli.main:main"

[project.urls]
Homepage = "https://github.com/SorbetSecurity/sorbet-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sorb"]
artifacts = [
    "src/sorb/dynamic/trace/hooks/*.cjs",  # non-.py interpreter hooks
    "src/sorb/ui/assets/**",               # self-contained web UI
    "src/sorb/plugin/proto/*.proto",       # gRPC plugin protocol
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20"]  # T20: no print() outside renderers
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/sorb/cli/*" = ["T20", "B008"]
"src/sorb/emit/human.py" = ["T20"]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
# pinned so mypy on Windows CI doesn't reject the Unix-only APIs in sandbox/linux.py
platform = "linux"
strict = true
mypy_path = "src"
packages = ["sorb"]
ignore_missing_imports = true
# Interpreter hooks are data files executed inside *target* processes (with
# legacy import protocols and no sorb imports), not part of the typed package.
exclude = "src/sorb/dynamic/trace/hooks/"

[[tool.mypy.overrides]]
module = "sorb.dynamic.trace.hooks.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A hung parser is a worse failure than a crashing one: fail the test instead
# of stalling CI until the job timeout.
timeout = 120
timeout_method = "thread"

[tool.importlinter]
root_package = "sorb"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "sorb.cli | sorb.ui",
    "sorb.core",
    "sorb.catalogers | sorb.binary | sorb.container | sorb.iac | sorb.host | sorb.resolve | sorb.dynamic | sorb.emit | sorb.plugin",
    "sorb.source | sorb.cache | sorb.graph",
    "sorb.ident",
    "sorb.model | sorb.errors | sorb.warnings",
]
# Sanctioned cross-L3 seams: the binary-analysis and IaC catalogers wrap their
# subsystems' parsers, exactly as the table-driven catalogers wrap
# `catalogers.common`.
ignore_imports = [
    "sorb.catalogers.* -> sorb.binary.embedded.*",
    "sorb.catalogers.* -> sorb.binary.analyze",
    "sorb.catalogers.* -> sorb.binary.formats",
    "sorb.catalogers.* -> sorb.binary.fingerprint",
    "sorb.catalogers.* -> sorb.binary.sigdb",
    "sorb.catalogers.* -> sorb.iac.hcl",
    "sorb.catalogers.* -> sorb.iac.imageref",
    # data-pack signature verification reuses the DSSE verifier.
    "sorb.binary.packs -> sorb.emit.signing",
    # the Windows registry cataloger wraps the sorb.host regf/hive reader
    # (offline Windows analysis) — same pattern as catalogers→binary.
    "sorb.catalogers.windows_registry -> sorb.host.regf",
    "sorb.catalogers.windows_registry -> sorb.host.windows",
    # the plugin hosts (WASM/gRPC) produce Catalogers and verify signed artifacts
    # with the DSSE machinery — sanctioned cross-L3 seams.
    "sorb.plugin.wasm -> sorb.catalogers.base",
    "sorb.plugin.grpc -> sorb.catalogers.base",
    "sorb.plugin.config -> sorb.catalogers.base",
    "sorb.plugin.validation -> sorb.catalogers.base",
    "sorb.plugin.wasm -> sorb.emit.signing",
    # the `sorb ui` / `sorb serve` commands launch the embedded UI server — the
    # one sanctioned cli→ui seam (co-equal presentation layers).
    "sorb.cli.commands.serve -> sorb.ui.config",
    "sorb.cli.commands.serve -> sorb.ui.runner",
]
