name: Feature request
description: Suggest an improvement, a new capability, or a new ecosystem/format
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >
        What are you trying to do that sorb doesn't support today? For a new
        ecosystem or file format, name the manifest/lockfile/binary format and
        link an example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the behavior or CLI look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other tools that do this.
    validations:
      required: false
